name: Patch realtime turn preview

on:
  push:
    branches: [new-rules-role-variant]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-rules-role-variant
          fetch-depth: 0

      - name: Patch realtime target preview
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # server-v2.js
          p=Path('server-v2.js')
          s=p.read_text(encoding='utf-8')
          old="extraRound:!!r.extraRound});"
          new="extraRound:!!r.extraRound,turnPreview:r.turnPreview?{fromId:r.turnPreview.fromId,toId:r.turnPreview.toId}:null});"
          assert old in s, 'publicState marker not found'
          s=s.replace(old,new,1)

          room_marker="location:null,matchOver:false,matchWinners:[],extraRound:false"
          assert room_marker in s, 'room marker not found'
          s=s.replace(room_marker,room_marker+",turnPreview:null",1)

          # Clear any old preview whenever a pending question is cleared.
          s=s.replace('r.pending=null;', 'r.pending=null;r.turnPreview=null;')

          handler="socket.on('select_target',({targetId})=>{const r=rooms.get(socket.roomCode);if(!r||r.phase!=='game'||r.pending||r.players[r.turnIndex]?.id!==socket.id)return;const t=r.players.find(p=>p.id===targetId);if(!t||t.id===socket.id)return;if(r.askedIds.has(t.id))return socket.emit('error_msg','Người này đã được hỏi trong vòng hiện tại.');if(r.lastQuestionerId===t.id)return socket.emit('error_msg','Không được hỏi lại người vừa hỏi mình.');r.turnPreview={fromId:socket.id,toId:t.id};emitRoom(r)});"
          anchor="socket.on('send_question',({targetId,question})=>"
          assert anchor in s, 'send_question anchor not found'
          assert 'socket.on(\'select_target\'' not in s, 'select_target already exists'
          s=s.replace(anchor,handler+anchor,1)

          # send_question is the only point that commits the target and question.
          marker="r.pending={fromId:socket.id,toId:t.id,q};"
          assert marker in s, 'pending marker not found'
          s=s.replace(marker,"r.turnPreview=null;"+marker,1)
          p.write_text(s,encoding='utf-8')

          # app.js
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          assert "extraRound:false};" in s, 'state marker not found'
          s=s.replace("extraRound:false};","extraRound:false,turnPreview:null};",1)

          old="wrap.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{state.selectedTarget=b.dataset.target;renderGame()})"
          new="wrap.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{state.selectedTarget=b.dataset.target;if(canAsk)socket.emit('select_target',{targetId:b.dataset.target});renderGame()})"
          assert old in s, 'target click handler not found'
          s=s.replace(old,new,1)

          old="targetSelect.value=state.selectedTarget||candidates[0]?.id||'';targetSelect.style.display='none';if(!state.selectedTarget&&candidates[0])state.selectedTarget=candidates[0].id;"
          new="targetSelect.value=state.selectedTarget||'';targetSelect.style.display='none';"
          assert old in s, 'target auto-select block not found'
          s=s.replace(old,new,1)

          # Make the built-in turn renderer use the server-authoritative preview too.
          old="if(pending){const from=state.players.find(p=>p.id===pending.fromId)?.name||'';const to=state.players.find(p=>p.id===pending.toId)?.name||'';$('turnLabel').textContent=`Lượt ${from} → ${to}`;$('turnInstruction').textContent=pending.toId===state.selfId?'Bạn trả lời câu hỏi bên dưới.':'Đang chờ câu trả lời.';return}"
          new="if(pending){const to=state.players.find(p=>p.id===pending.toId)?.name||'';$('turnLabel').textContent=`Lượt ${to} trả lời`;$('turnInstruction').textContent=pending.toId===state.selfId?'Bạn trả lời câu hỏi bên dưới.':`Đang chờ ${to} trả lời.`;return}"
          assert old in s, 'app renderTurn pending block not found'
          s=s.replace(old,new,1)

          old="const myTurn=current?.id===state.selfId;$('turnLabel').textContent=myTurn?'Lượt của bạn':`Lượt: ${current?.name||''}`;$('turnInstruction').textContent=myTurn?'Chọn một người và đặt câu hỏi.':'Chờ người đang có lượt.'"
          new="const preview=state.turnPreview;if(preview){const from=state.players.find(p=>p.id===preview.fromId);const to=state.players.find(p=>p.id===preview.toId);if(from&&to){$('turnLabel').textContent=`Lượt ${from.name} → ${to.name}`;$('turnInstruction').textContent='Đặt câu hỏi cho người chơi đã chọn.';return}}const myTurn=current?.id===state.selfId;$('turnLabel').textContent=`Lượt của ${current?.name||''}`;$('turnInstruction').textContent=myTurn?'Chọn một người và đặt câu hỏi.':`Đang chờ ${current?.name||''} đặt câu hỏi.`"
          assert old in s, 'app renderTurn current block not found'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # turn-role-fix.js
          p=Path('turn-role-fix.js')
          p.write_text("""(()=>{\n  const $=id=>document.getElementById(id);\n  function findName(id){return (state.players||[]).find(p=>p.id===id)?.name||'Người chơi'}\n  function render(){\n    const label=$('turnLabel'),instruction=$('turnInstruction');\n    if(!label)return;\n    const players=state.players||[],pending=state.pending,preview=state.turnPreview;\n    if(state.phase==='discussion'){label.textContent='THẢO LUẬN';if(instruction)instruction.textContent='Tất cả đã được hỏi. Thảo luận và bỏ phiếu.';return}\n    if(state.phase==='round_decision'){label.textContent='BIỂU QUYẾT';if(instruction)instruction.textContent='Thảo luận xem có chơi thêm 1 vòng hay không.';return}\n    if(state.phase!=='game')return;\n    if(pending){const toName=findName(pending.toId);label.textContent=`Lượt ${toName} trả lời`;if(instruction)instruction.textContent=pending.toId===state.selfId?'Trả lời câu hỏi bên dưới.':`Đang chờ ${toName} trả lời.`;return}\n    if(preview){const fromName=findName(preview.fromId),toName=findName(preview.toId);label.textContent=`Lượt ${fromName} → ${toName}`;if(instruction)instruction.textContent='Đặt câu hỏi cho người chơi đã chọn.';return}\n    const current=players[state.turnIndex];\n    if(!current)return;\n    label.textContent=`Lượt của ${current.name}`;\n    if(instruction)instruction.textContent=current.id===state.selfId?'Chọn một người và đặt câu hỏi.':`Đang chờ ${current.name} đặt câu hỏi.`;\n  }\n  socket.on('role',()=>setTimeout(render,0));\n  socket.on('room_state',()=>setTimeout(render,0));\n  setInterval(render,250);\n  setTimeout(render,0);\n})();\n""",encoding='utf-8')

          # Bust browser cache for changed client scripts.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('app.js?v=20260916m','app.js?v=20260916n')
          s=s.replace('turn-role-fix.js?v=20260916m','turn-role-fix.js?v=20260916n')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server-v2.js app.js turn-role-fix.js index.html .github/workflows/patch-turn-preview.yml
          git rm .github/workflows/patch-turn-preview.yml
          git commit -m "Fix realtime target preview without losing question draft"
          git push origin new-rules-role-variant
